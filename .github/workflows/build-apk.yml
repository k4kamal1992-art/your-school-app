name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Unzip project (works no matter what you named the zip)
        run: unzip -o *.zip

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install npm dependencies
        working-directory: your-school-app
        run: npm install

      - name: Add Android platform (first run only)
        working-directory: your-school-app
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi

      - name: Sync web assets into the Android project
        working-directory: your-school-app
        run: npx cap sync android

      - name: Make gradlew executable
        working-directory: your-school-app
        run: chmod +x android/gradlew

      - name: Build debug APK
        working-directory: your-school-app/android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: your-school-app-debug-apk
          path: your-school-app/android/app/build/outputs/apk/debug/app-debug.apk
