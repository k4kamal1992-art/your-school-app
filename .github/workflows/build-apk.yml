name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Unzip project
        run: unzip -o your-school-app.zip

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK Licenses
        run: yes | sdkmanager --licenses || true

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      # প্যাকেজ আইডি স্পষ্টভাবে নিশ্চিত করতে clean prebuild রান করা
      - name: Expo Prebuild (Clean Android directory)
        run: |
          npx expo prebuild --platform android --clean --no-install

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      # প্রজেক্ট রুট প্যারামিটার স্পষ্টভাবে পাস করে Gradle রান করা
      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon -PreactNativeDir=../node_modules/react-native

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: your-school-app-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
