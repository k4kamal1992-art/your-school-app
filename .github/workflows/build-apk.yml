name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Unzip project
        run: unzip -o your-school-app.zip

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # সব ধরনের লাইসেন্স স্বয়ংক্রিয়ভাবে অ্যাক্সেপ্ট করা (টার্মিনাল পাইপিং)
      - name: Accept Android SDK Licenses
        run: |
          yes y | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses || true

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      # প্রি-বিল্ড করে অ্যান্ড্রয়েড ফাইল তৈরি করা
      - name: Prebuild Android project
        run: |
          rm -rf android
          npx expo prebuild --platform android --clean --no-install

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      # গ্রেডেলের স্বয়ংক্রিয় লাইসেন্স চেকার এড়িয়ে বিল্ড করা
      - name: Build Debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon -Pandroid.builder.sdkDownload=false

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: your-school-app-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
