name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # জিপ ফাইল আনজিপ করা
      - name: Unzip project
        run: unzip -o your-school-app.zip

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      # working-directory বাদ দিয়ে সরাসরি রুটে ইনস্টল করা হচ্ছে
      - name: Install npm dependencies
        run: npm install

      # Expo প্রজেক্ট থেকে অ্যান্ড্রয়েড ফোল্ডার তৈরি করা
      - name: Generate Android folder (Expo Prebuild)
        run: npx expo prebuild --platform android

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      # APK বিল্ড করা
      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      # APK ডাউনলোড করার জন্য আপলোড
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: your-school-app-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
