name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Unzip project
        run: unzip -o your-school-app.zip

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      # স্বয়ংক্রিয়ভাবে সব অ্যান্ড্রয়েড লাইসেন্স গ্রহণ করা
      - name: Accept Android SDK Licenses
        run: yes | sdkmanager --licenses || true

      - name: Install npm dependencies
        run: npm install

      # ইন্টারঅ্যাক্টিভ প্রম্পট বন্ধ রাখতে --no-install ফ্ল্যাগ ব্যবহার
      - name: Generate Android folder (Expo Prebuild)
        run: npx expo prebuild --platform android --no-install

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: your-school-app-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
