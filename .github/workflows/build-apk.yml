name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Unzip project
        run: unzip -o your-school-app.zip

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # রানারের ডিফল্ট অ্যান্ড্রয়েড এসডিকে-তে সরাসরি সব লাইসেন্স গ্রহণ করা
      - name: Accept Android SDK Licenses
        run: |
          yes | sdkmanager --licenses || true

      - name: Install EAS CLI and Dependencies
        run: |
          npm install -g eas-cli
          npm install --legacy-peer-deps

      # EAS লোকাল বিল্ড দিয়ে সরাসরি APK তৈরি (ইন্টারঅ্যাক্টিভ প্রশ্ন ছাড়াই)
      - name: Build Android APK locally
        run: eas build --platform android --profile preview --local --non-interactive

      # তৈরি হওয়া APK ফাইলটি আর্টফ্যাক্ট হিসেবে আপলোড করা
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: school-app-debug-apk
          path: ./*.apk
