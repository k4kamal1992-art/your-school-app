name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Unzip project
        run: unzip -o your-school-app.zip

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # রানারের ডিফল্ট অ্যান্ড্রয়েড এসডিকে সরাসরি এনভায়রনমেন্টে সেট করা এবং লাইসেন্স গ্রহণ করা
      - name: Configure Android SDK and Accept Licenses
        run: |
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          echo "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "$ANDROID_SDK_ROOT/platform-tools" >> $GITHUB_PATH
          
          mkdir -p "$ANDROID_SDK_ROOT/licenses"
          echo "24333f8a63b6825ea9c5514f83c2829b004d1fee" > "$ANDROID_SDK_ROOT/licenses/android-sdk-license"
          echo "84831b9409646a918e30573bab4লগ থেকে স্পষ্ট দেখা যাচ্ছে যে `android-actions/setup-android@v3` স্টেপটি চলাকালীন রানারটি আবার আটকে গেছে। এই অ্যাকশনটি ব্যাকগ্রাউন্ডে অতিরিক্ত কিছু প্যাকেজ (যেমন Google Glass / GDK ইত্যাদি) ডাউনলোড করতে চায়, যার লাইসেন্স কনসোলে ইন্টারেক্টিভ ইনপুট ছাড়া গ্রহণ করা সম্ভব হয় না।

GitHub-এর ডিফল্ট `ubuntu-latest` রানারে আগে থেকেই সম্পূর্ণ প্রস্তুত **Android SDK** এবং **Command-line tools** ইনস্টল করা থাকে। তাই কোনো অতিরিক্ত থার্ড-পার্টি অ্যান্ড্রয়েড সেটআপ অ্যাকশন ব্যবহার না করে সরাসরি সিস্টেমের বিল্ট-ইন টুলস ব্যবহার করাই সবচেয়ে কার্যকর সমাধান।

---

### সমাধানকৃত Workflow কোড

আপনার `.github/workflows/android-apk.yml` ফাইলটি নিচের কোড দিয়ে পরিবর্তন করুন:

```yaml
name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Unzip project
        run: unzip -o your-school-app.zip

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # রানারের নিজস্ব অ্যান্ড্রয়েড লাইসেন্স ডিরেক্টরি তৈরি ও স্বয়ংক্রিয় অনুমোদন
      - name: Accept Android SDK Licenses
        run: |
          mkdir -p "$ANDROID_HOME/licenses"
          echo -e "24333f8a63b6825ea9c5514f83c2829b004d1fee\nd56f5187479451eabf01fb78af6dfcb131a6481e\n24333f8a63b6825ea9c5514f83c2829b004d1fee" > "$ANDROID_HOME/licenses/android-sdk-license"
          echo -e "84831b9409646a918e30573bab4c9c91346d8abd" > "$ANDROID_HOME/licenses/android-sdk-preview-license"
          echo -e "601085b94cd77f0b54ff8640695544944146e816" > "$ANDROID_HOME/licenses/android-googletv-license"
          echo -e "33b6a2b64607f11b759f320ef9dff4ae5c47d97a\ne9acab5b5fbb560a72cfa4f71c0ad07945a47881" > "$ANDROID_HOME/licenses/mips-android-sysimage-license"
          echo -e "859f317696f67ef43ecde8028823180d1a447662" > "$ANDROID_HOME/licenses/android-sdk-arm-dbt-license"
          echo -e "51336184154a69e7e5ebf8737c34b15099388df6" > "$ANDROID_HOME/licenses/google-gdk-license"
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      # প্রি-বিল্ডের মাধ্যমে ফ্রেশ অ্যান্ড্রয়েড ফাইল তৈরি
      - name: Expo Prebuild
        run: |
          rm -rf android
          npx expo prebuild --platform android --clean --no-install

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      # Gradle দিয়ে সরাসরি APK তৈরি
      - name: Build Debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: your-school-app-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
